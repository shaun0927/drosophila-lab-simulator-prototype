name: Fly-lab lived experience entry
description: Capture a user-provenance lab incident for R1 without turning it into arbitrary content.
title: "R1 lived experience: "
labels:
  - validation
  - needs-user-input
body:
  - type: markdown
    attributes:
      value: |
        Use this when adding firsthand, observed, or secondhand fly-lab experience to close #27.
        Apply `docs/fly-lab-validation-finding-decision-tree.md` before turning the entry into implementation work.
        Keep it concrete. The goal is to convert real lab friction into game verbs, failure modes, delayed consequences, and SME risks.
  - type: dropdown
    id: provenance
    attributes:
      label: Provenance
      options:
        - Firsthand
        - Observed
        - Secondhand
        - User explicitly has no relevant experience to add
    validations:
      required: true
  - type: textarea
    id: incident
    attributes:
      label: Concrete incident
      description: What actually happened in lab terms?
    validations:
      required: true
  - type: textarea
    id: game_verb
    attributes:
      label: Game verb
      description: What should the player do because of this incident?
    validations:
      required: true
  - type: textarea
    id: failure_consequence
    attributes:
      label: Failure mode and delayed consequence
      description: What can go wrong, and how should it matter later?
    validations:
      required: true
  - type: textarea
    id: comedy_boundary
    attributes:
      label: Comedy source and boundary
      description: What is funny because it is real, and what should not be joked about?
  - type: textarea
    id: sme_risk
    attributes:
      label: SME risk
      description: What could be scientifically misleading if simplified badly?
    validations:
      required: true
  - type: textarea
    id: map_update
    attributes:
      label: Proposed update to docs/fly-lab-experience-map.md
      description: Paste the event-table row or note that this should not be included.
    validations:
      required: true
  - type: textarea
    id: implementation_scope
    attributes:
      label: Final Implementation Scope
      description: If this entry should change the game, name the exact screens, mechanics, data fields, or reviewer rules that may change. Write `No implementation change` if it only informs exclusion or SME risk.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the smallest lived-experience-backed outcome this entry should produce.
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: Success Criteria
      description: List concrete pass conditions tied to the real incident, player verb, failure mode, and delayed consequence.
    validations:
      required: true
  - type: textarea
    id: verification_method
    attributes:
      label: Verification Method
      description: Include the command, fixture, screenshot, player re-check, SME re-check, or ledger update that proves the entry was handled.
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails
      description: State what must remain true so the lived experience does not become arbitrary spectacle or misleading lab intuition.
    validations:
      required: true
  - type: textarea
    id: explicit_non_goals
    attributes:
      label: Explicit Non-Goals
      description: Name adjacent ideas, jokes, broad genetics systems, or parked Unity work that this entry must not pull into scope.
    validations:
      required: true
  - type: textarea
    id: implementation_approach
    attributes:
      label: Implementation Approach
      description: Describe the intended code/data/doc change, or explain why this entry only changes the experience map or exclusion rules.
    validations:
      required: true
  - type: textarea
    id: pr_decomposition
    attributes:
      label: PR Decomposition
      description: Say whether this is one PR or split into staged PRs, and why.
    validations:
      required: true
  - type: textarea
    id: over_engineering_checklist
    attributes:
      label: Over-Engineering Checklist
      description: List the abstractions, simulation systems, or content expansion this entry deliberately avoids.
    validations:
      required: true
  - type: textarea
    id: drift_prevention_checklist
    attributes:
      label: Drift-Prevention Checklist
      description: List checks that keep this entry aligned with the R-series Procedure Lab contract.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: State the final evidence required before this lived-experience entry can count toward #27.
    validations:
      required: true
