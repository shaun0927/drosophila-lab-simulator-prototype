name: Fly-lab validation finding
description: Convert a player or SME validation result into a scoped fix/cut issue.
title: "R7 validation finding: "
labels:
  - validation
  - drift-guardrail
body:
  - type: markdown
    attributes:
      value: |
        Use this after running `docs/fly-lab-validation-runbook.md`.
        Apply `docs/fly-lab-validation-finding-decision-tree.md` before filing.
        Do not file broad redesign wishes here. Each issue should fix or cut one observed validation failure.
  - type: dropdown
    id: source
    attributes:
      label: Finding source
      options:
        - Player session
        - SME review
        - Browser QA
        - Smoke test
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route or fixture
      options:
        - First-run route
        - clean fixture
        - dirty fixture
        - missing-control fixture
        - other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed evidence
      description: Quote the player/SME or describe the failed check.
    validations:
      required: true
  - type: textarea
    id: affected_mechanic
    attributes:
      label: Affected mechanic
      description: Name the exact mechanic, record field, UI element, or reviewer rule.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Cut or redesign before #33 can close
        - Fix before #33 can close
        - Follow-up polish after #33
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the smallest player/SME-validated outcome this issue must achieve.
    validations:
      required: true
  - type: textarea
    id: final_implementation_scope
    attributes:
      label: Final Implementation Scope
      description: Name the exact screens, mechanics, data fields, or reviewer rules that may change.
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: Success Criteria
      description: List concrete pass conditions tied to the observed finding.
    validations:
      required: true
  - type: textarea
    id: verification_method
    attributes:
      label: Verification Method
      description: Include automated checks, fixture URLs, screenshot/player/SME re-checks, and the exact command or evidence source.
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails
      description: State what must remain true about the R-series procedure-first contract while fixing this finding.
    validations:
      required: true
  - type: textarea
    id: explicit_non_goals
    attributes:
      label: Explicit Non-Goals
      description: Name tempting adjacent work that must not be included in this issue.
    validations:
      required: true
  - type: textarea
    id: implementation_approach
    attributes:
      label: Implementation Approach
      description: Describe the intended code/data/doc change without broad redesign language.
    validations:
      required: true
  - type: textarea
    id: pr_decomposition
    attributes:
      label: PR Decomposition
      description: Say whether this is one PR or split into staged PRs, and why.
    validations:
      required: true
  - type: textarea
    id: over_engineering_checklist
    attributes:
      label: Over-Engineering Checklist
      description: List the abstractions, systems, or content expansion this issue deliberately avoids.
    validations:
      required: true
  - type: textarea
    id: drift_prevention_checklist
    attributes:
      label: Drift-Prevention Checklist
      description: List checks that keep the fix from reintroducing phenomenon-first, unsupported, or parked Unity scope.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: State the final evidence required before this issue can close.
    validations:
      required: true
