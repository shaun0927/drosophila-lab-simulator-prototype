name: Web prototype smoke

on:
  pull_request:
  push:
    branches:
      - main
      - r-series-fly-lab-procedure-slice

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check web-prototype/app.js
          node --check web-prototype/data.js
          node --check web-prototype/smoke-tests.js
          node --check tools/external-evidence-check.js
          node --check tools/external-evidence-check.test.js
          node --check tools/external-validation-tracker-check.js
          node --check tools/external-validation-tracker-check.test.js
          node --check tools/external-validation-execution-contract-check.js
          node --check tools/external-validation-execution-contract-check.test.js
          node --check tools/external-validation-intake-runbook-check.js
          node --check tools/external-validation-intake-runbook-check.test.js
          node --check tools/external-validation-issue-state-audit.js
          node --check tools/external-validation-issue-state-audit.test.js
          node --check tools/external-validation-full-check.js
          node --check tools/final-closure-readiness-check.js
          node --check tools/final-closure-readiness-check.test.js
          node --check tools/open-issue-triage-audit.js
          node --check tools/open-issue-triage-audit.test.js
          node --check tools/issue-template-contract-check.js

      - name: Run fly-lab smoke tests
        run: node web-prototype/smoke-tests.js

      - name: Check R-series status artifacts
        run: node tools/r-series-status-check.js

      - name: Check external evidence ledger
        run: node tools/external-evidence-check.js

      - name: Check external validation tracker
        run: node tools/external-validation-tracker-check.js

      - name: Self-test external validation tracker
        run: node tools/external-validation-tracker-check.test.js

      - name: Check external validation execution contracts
        run: node tools/external-validation-execution-contract-check.js

      - name: Self-test external validation execution contracts
        run: node tools/external-validation-execution-contract-check.test.js

      - name: Check external validation intake runbook
        run: node tools/external-validation-intake-runbook-check.js

      - name: Self-test external validation intake runbook
        run: node tools/external-validation-intake-runbook-check.test.js

      - name: Self-test external evidence checker
        run: node tools/external-evidence-check.test.js

      - name: Self-test external validation issue-state audit
        run: node tools/external-validation-issue-state-audit.test.js

      - name: Check final closure readiness
        run: node tools/final-closure-readiness-check.js

      - name: Self-test final closure readiness
        run: node tools/final-closure-readiness-check.test.js

      - name: Self-test open issue triage audit
        run: node tools/open-issue-triage-audit.test.js

      - name: Check evidence issue templates
        run: node tools/issue-template-contract-check.js
