<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200 Loop Ideas</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div><h1>200 Core Loop Idea Prototypes</h1><p>동기심리학 기반 재미 엔진 발산/검증용</p></div><a href="index.html">15 curated loops</a></header><section class="panel" style="margin-top:16px"><h2>Playable 200-Idea Index</h2><p class="body">각 후보는 같은 2분 micro-runner를 공유하지만, 서로 다른 동기축/상황/선택/판단 질문을 갖습니다. 필터로 훑고 마음에 걸리는 것부터 눌러보세요.</p><input id="filter" class="choice" style="width:100%;cursor:text" placeholder="filter: reviewer, catalog, spread, ethics..."/><div id="list" class="index-grid" style="margin-top:14px"></div></section></main><script>let LOOPS200=[];fetch('loops200.json').then(r=>r.json()).then(d=>{LOOPS200=d;render()});function render(){let q=(document.getElementById('filter').value||'').toLowerCase();document.getElementById('list').innerHTML=LOOPS200.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).map(l=>`<a class="index-card" href="idea.html?id=${l.id}"><span class="kicker">#${String(l.n).padStart(3,'0')} · ${l.axis}</span><h2>${l.name}</h2><p>${l.hook}</p><p><b>Judge:</b> ${l.test}</p></a>`).join('')}document.getElementById('filter').oninput=render;</script></body></html>
