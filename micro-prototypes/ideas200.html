<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200 Loop Ideas</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div><h1>200 Playable Idea Sketches</h1><p>장황한 설명 대신 각 후보의 아이디어, 핵심 조작, 구현된 스케치만 봅니다.</p></div><a href="index.html">15 curated loops</a></header><section class="panel" style="margin-top:16px"><h2>Playable 200-Idea Index</h2><p class="body">각 카드는 핵심만 보여줍니다: 아이디어 / 조작 / 재밌는 순간. 후보를 누르면 간단한 playable sketch를 바로 실행합니다.</p><input id="filter" class="choice" style="width:100%;cursor:text" placeholder="filter: reviewer, catalog, spread, ethics, mastery, curiosity..."/><div id="list" class="index-grid" style="margin-top:14px"></div></section></main><script>let LOOPS200=[];fetch('loops200.json?v=human-readable-v1').then(r=>r.json()).then(d=>{LOOPS200=d;render()});function render(){let q=(document.getElementById('filter').value||'').toLowerCase();document.getElementById('list').innerHTML=LOOPS200.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).map(l=>`<a class="index-card" href="idea.html?id=${l.id}"><span class="kicker">#${String(l.n).padStart(3,'0')} · ${l.axis} · ${l.mechanic}</span><h2>${l.name}</h2><p>${l.hook}</p><p><b>Plain:</b> ${(l.human_review_card||{}).one_sentence||l.player_promise}</p><p><b>Do:</b> ${((l.human_review_card||{}).actual_player_actions||[]).slice(0,3).join(' / ')}</p><p><b>Signature:</b> ${(l.human_review_card||{}).signature_moment||l.test}</p></a>`).join('')}document.getElementById('filter').oninput=render;</script></body></html>
