<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200 Loop Ideas</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div><h1>200 Enhanced Core Loop Ideas</h1><p>각 후보는 동기 가설, 디자인 규칙, 성공 신호, 컷 리스크를 포함합니다.</p></div><a href="index.html">15 curated loops</a></header><section class="panel" style="margin-top:16px"><h2>Playable 200-Idea Index</h2><p class="body">필터로 동기축/키워드를 훑고, 후보를 눌러 3-beat micro-run을 플레이하세요. 목적은 완성도가 아니라 어떤 재미 엔진이 감정적으로 걸리는지 선별하는 것입니다.</p><input id="filter" class="choice" style="width:100%;cursor:text" placeholder="filter: reviewer, catalog, spread, ethics, mastery, curiosity..."/><div id="list" class="index-grid" style="margin-top:14px"></div></section></main><script>let LOOPS200=[];fetch('loops200.json?v=commercial-v1').then(r=>r.json()).then(d=>{LOOPS200=d;render()});function render(){let q=(document.getElementById('filter').value||'').toLowerCase();document.getElementById('list').innerHTML=LOOPS200.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).map(l=>`<a class="index-card" href="idea.html?id=${l.id}"><span class="kicker">#${String(l.n).padStart(3,'0')} · ${l.axis} · ${l.mechanic}</span><h2>${l.name}</h2><p>${l.hook}</p><p><b>Promise:</b> ${l.player_promise}</p><p><b>Judge:</b> ${l.test}</p></a>`).join('')}document.getElementById('filter').oninput=render;</script></body></html>
