<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200 Idea Selection Workbench</title><link rel="stylesheet" href="style.css"><style>.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px}.row{display:grid;grid-template-columns:48px 1fr 440px;gap:12px;align-items:start;border:1px solid #30384d;border-radius:14px;background:#101722;padding:12px;margin:10px 0}.small{font-size:13px;color:#bcb4a4}.scoregrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.scoregrid label{font-size:11px;color:#bcb4a4}.scoregrid input{width:100%;background:#070b12;color:#fff;border:1px solid #384057;border-radius:6px;padding:5px}.fav{font-size:24px;background:#1b2233;color:#f5c86a;border:1px solid #384057;border-radius:10px;cursor:pointer}.fav.on{background:#5c3b09}.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.actions a,.actions button{border:1px solid #384057;border-radius:8px;background:#172033;color:#f3ecdc;padding:7px 9px;text-decoration:none;cursor:pointer}.summary{white-space:pre-wrap;background:#070b12;border:1px solid #26324a;border-radius:12px;padding:10px;max-height:220px;overflow:auto}</style></head><body><main class="wrap"><header class="top"><div><h1>200 Idea Selection Workbench</h1><p>200 → 40 → 15 → 5 선별용. 점수는 브라우저 localStorage에 저장됩니다.</p></div><a href="ideas200.html">200 index</a></header><section class="panel" style="margin-top:16px"><div class="toolbar"><input id="filter" class="choice" placeholder="filter title/genre/motive: reviewer, rhythm, horror, Codex..." style="cursor:text"><button class="choice" id="sort">Sort by score</button><button class="choice" id="export">Export shortlist</button></div><p class="body">Score 1-5: Curiosity, Tension, Payoff, Replay, Feasibility, Presentation, Fit. Favorite promising candidates regardless of score.</p><div id="summary" class="summary"></div><div id="list"></div></section></main><script src="workbench.js?v=1"></script></body></html>
